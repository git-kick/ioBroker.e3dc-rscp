# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '21 2 6 * *'
    open-pull-requests-limit: 15
    versioning-strategy: 'increase'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    cooldown:
      default-days: 7
    # Bundle same-risk updates into one PR instead of one PR per package.
    # Kept aligned with .github/auto-merge.yml: only the update types that
    # are already auto-merged there (production:patch, dev:patch+minor)
    # are grouped. Major bumps are intentionally left out of every group,
    # so they keep arriving as separate PRs for manual review.
    groups:
      production-patches:
        dependency-type: 'production'
        update-types:
          - 'patch'
      development-updates:
        dependency-type: 'development'
        update-types:
          - 'patch'
          - 'minor'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '47 3 17 * *'
    open-pull-requests-limit: 15
    # Same idea: patch/minor Action bumps land in one PR, majors (e.g. a
    # v1 -> v2 tag change) stay separate since those aren't auto-merged.
    groups:
      actions-updates:
        update-types:
          - 'patch'
          - 'minor'